[project]
name = "cooking-rag"
version = "0.1.0"
description = "From-scratch RAG pipeline over the Cooking Stack Exchange corpus"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "anthropic>=0.40",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rag = "rag.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
